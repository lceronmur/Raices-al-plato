<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante - Raíces al plato</title>
  <link rel="stylesheet" href="estilos/header.css">
  <link rel="stylesheet" href="estilos/restaurante.css">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Comme:wght@100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="titulo">
      <h1>Raíces al plato</h1>
    </div>
    <div class="logo">
      <a href="index.html">
        <img src="imagenes/logo.png" alt="Logo Raíces al Plato">
      </a>
    </div>
    <nav>
      <button onclick="window.location.href='mapa.html'">Mapa</button>
      <button onclick="window.location.href='menu.html'">Menú</button>
    </nav>
  </header>

  <main class="rest-page">
    <div class="breadcrumb">
      <button class="volver" onclick="history.back()">Volver</button>
      <span id="rest-breadcrumb"></span>
    </div>

    <section class="encabezado">
      <div class="texto">
        <h1 id="rest-nombre"></h1>
        <h2>¿Por qué lo recomendamos?</h2>
        <p id="rest-descripcion"></p>
        <div class="precio">
          <span class="label">Rango de precios: </span>
          <span id="rest-precio"></span>
        </div>
      </div>
      <div class="ilustracion">
        <img src="imagenes/perroprincipal 1.png" alt="Duki chef">
      </div>
    </section>

    <section class="galeria">
      <div id="galeria-grid" class="galeria-grid"></div>
    </section>

    <section class="ideal">
      <h3 id="rest-ideal"></h3>
    </section>

    <section class="resenas">
      <div class="resenas-header">
        <h2>Lo que piensas hace la diferencia</h2>
        <img src="imagenes/perroalalado.png" alt="Duki feliz">
      </div>
      <div id="lista-resenas" class="resenas-lista"></div>
    </section>

    <div class="pattern"></div>
  </main>

  <script src="js/restaurante.js"></script>
</body>
</html>
