<script>
  function irA(pagina) {
    window.location.href = pagina;
  }

  // Búsqueda por nombre de plato
  const buscador = document.getElementById("buscador-menu");
  const itemsMenu = Array.from(document.querySelectorAll(".grid .item"));

  const filtrar = (texto) => {
    const term = texto.trim().toLowerCase();
    itemsMenu.forEach(card => {
      const nombre = (card.innerText || "").toLowerCase();
      card.style.display = term === "" || nombre.includes(term) ? "block" : "none";
    });
  };

  buscador.addEventListener("input", (e) => filtrar(e.target.value));
</script>
