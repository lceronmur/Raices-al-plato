<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raíces al plato</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="estilos/header.css" />
  <link rel="stylesheet" href="estilos/menu.css" />
  <!-- Fuente decorativa similar al diseño -->
   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Comme:wght@100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
  <header>
    <div class="titulo">
      <h1>Raíces al plato</h1>
    </div>

    <div class="logo">
      <img src="imagenes/logo.png" alt="Logo Raíces al Plato" />
    </div>

    <nav>
      <button onclick="irA('mapa.html')">Mapa</button>
      <button onclick="irA('menu.html')">Menú</button>
    </nav>
  </header>

<body>
  <div class="subnav">
    Inicio &lt; Completo
    <button class="filter-btn" onclick="irA('menu.html')">Volver</button>


    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Buscar..." />

    </div>

  </div>


  <div class="grid">

    <div class="item">
      <img src="imagenes/hangua.png" alt="Changua" />
      <button onclick="irA('producto.html?item=changua')">🍲 Changua</button>
    </div>

    <div class="item">
      <img src="imagenes/moñona.png" alt="Moñona" />
      <button onclick="irA('producto.html?item=moñona')">🍲 Moñona</button>
    </div>

    <div class="item">
      <img src="imagenes/chanfaina.png" alt="Chanfaina" />
      <button onclick="irA('producto.html?item=chanfaina')">🍲 Chanfaina</button>
    </div>

    <div class="item">
      <img src="imagenes/lechona.png" alt="Lechona" />
      <button onclick="irA('producto.html?item=lechona')">🍲 Lechona</button>
    </div>

    <div class="item">
      <img src="imagenes/puchero.png" alt="Puchero" />
      <button onclick="irA('producto.html?item=puchero')">🍲 Puchero</button>
    </div>
    <div class="item">
      <img src="imagenes/ajiaco2.jpeg" alt="Ajiaco" />
      <button onclick="irA('producto.html?item=ajiaco')">🍲 Ajiaco</button>
    </div>


    <div class="item">
      <img src="imagenes/tamal.webp" alt="Tamal" />
      <button onclick="irA('producto.html?item=tamal')">🍲 Tamal</button>
    </div>


    <div class="item">
      <img src="imagenes/aguapanela2.jpeg" alt="Aguapanela" />
      <button onclick="irA('producto.html?item=aguapanela')">🍲 Aguapanela</button>
    </div>

  </div>

  <div class="bottom-dog">
    <img src="imagenes/footer.png" alt="Perro" width="500" />
  </div>


</body>

</html>
<script>
  function irA(pagina) {
    window.location.href = pagina;
  }
</script>
